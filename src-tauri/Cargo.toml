[package]
name = "moderntodolist"
version = "2.0.0-dev"
description = "ModernToDoList - Portable Windows Desktop Task Manager"
authors = ["ModernToDoList Team"]
edition = "2021"

[[bin]]
name = "ModernToDoList"
path = "src/main.rs"

[lib]
name = "moderntodolist_lib"
# rlib only. The Tauri template default is ["staticlib", "cdylib", "rlib"], but
# staticlib/cdylib are only consumed by the iOS/Android mobile entry points, and
# this product ships as a Windows portable desktop app. Keeping them made every
# integration test target fail to link with "crate `X` required to be available
# in rlib format, but was not found in this form" (and cascading
# "can't find crate for moderntodolist_lib"), because cargo builds the
# dependency graph for the static/cdylib units without the rlib metadata that
# tests/*.rs need. `cargo test --lib` still passed, which made this easy to
# misdiagnose as target-directory corruption. Restore staticlib/cdylib only if a
# mobile target is ever added.
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
env_logger = "0.11"
tauri-plugin-single-instance = "2"
tokio = { version = "1", features = ["full"] }
quick-xml = "0.37"
blake3 = "1"
thiserror = "2"
rusqlite = { version = "0.32", features = ["bundled"] }
uuid = { version = "1", features = ["v4"] }
notify = "7"
sha2 = "0.10"
rand = { version = "0.8", features = ["std", "small_rng"] }
walkdir = "2"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
regex = "1"
tempfile = "3"
zip = { version = "2", default-features = false, features = ["deflate"] }
scraper = "0.20"

[dev-dependencies]
tempfile = "3"

[profile.release]
panic = "abort"
strip = true
lto = true
